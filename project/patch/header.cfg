# # Patch rom header  # # # # # # # # # # # # # # # # # # # # # # # # #
#   More info about header in https://n64brew.dev/wiki/ROM_Header     #
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

include <macros.cfg>

# clear rom name before patching new name
header_name      = MEMSET(0, 27)

# max 20 characters
header_name      = "THE LEGEND OF ZELDA " 
# header_name MUST be "THE LEGEND OF ZELDA", or else Motion Blur, sepia, and other effects 
# break under an emulator! (this does not effect ares at all, as its cycle accurate)
header_media_fmt = "N"
header_game_id   = "ZL"
header_region    = "E"
header_revision  = 0x00

# You can also patch files into addresses
# 0x3FFFFF0 = FILE("deadbeef.bin")